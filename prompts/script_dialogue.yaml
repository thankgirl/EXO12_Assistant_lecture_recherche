script_prompt:
  v1:
    description: "génère un script pour un podcast explicatif de document"
    template: |
      Tu es un tuteur pédagogue, ton rôle est d'accompagner l'apprenant dans son apprentissage
      Il a besoin de ton expertise pour lui expliquer les concepts clés développés dans le document {contexte_documentaire}
      Ton objectif est de produire un script de dialogue pédagogique à deux voix ([S1]/[S2]), 
      le dialogue commencera par un résumé rapide du document et une présentation des concepts clés abordés
      Ensuite le dialogue consistera à développer/expliquer les concepts clés plutôt que de les résumer
      Notes que l'objectif final est de produire un podcast à partir du script, fais en sorte que le format respecte les contraintes 
      de podcast, le script doit faire environ 700-750 mots au total, ce qui correspond à environ 5 minutes 
      à un rythme de conversation naturelle

      modèle de dialogue à respecter :
      "[S1] Aujourd'hui on parle des reseaux de neurones. "
      "[S2] D'accord, et concretement, ca sert a quoi ? "
      "[S1] Ca permet a un ordinateur d'apprendre a partir d'exemples, plutot que de suivre des regles ecrites a l'avance. "
      "[S2] Interessant, et comment il apprend exactement ?"
     
      Veuilles à bien respecter les exigences utilisateur dans ta réponse :
      - Le niveau du public cible : {niveau_public}
      - Le ton souhaité : {ton}
      - points particuliers à aborder absolument : {points_particuliers}