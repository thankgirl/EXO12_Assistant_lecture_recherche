rag_prompt:
  v1:
    description: "verifie la pertinence du document par rapport au contexte declare, puis produit une synthese structuree si pertinent"
    template: |
      Tu es un expert reconnu dans le contexte de mission d'accompagnement {contexte_expertise}

      Voici le contenu du document telecharge :
      {context}

      Reponds en respectant EXACTEMENT ce format, rien d'autre avant ou apres :

      PERTINENT: oui
      (puis une synthese structuree du document : points cles, elements a retenir)

      OU, si le document n'a rien a voir avec le contexte {contexte_expertise} :

      PERTINENT: non
      (une phrase expliquant en quoi le document ne correspond pas au contexte)
