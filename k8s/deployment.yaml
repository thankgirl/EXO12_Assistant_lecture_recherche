# k8s/deployment.yaml — deploiement OpenShift (pipeline Tekton, exercice 10)
#
# Nom du Deployment ET du conteneur = deployment-name passe au pipeline
# (tkn pipeline start ... -p deployment-name=exo12-assistant-rag) - la tache
# update-deployment du pipeline s'appuie sur cette correspondance pour savoir quel
# conteneur pointer vers l'image fraichement construite.
#
# ANTHROPIC_API_KEY : jamais ici en valeur - reference un Secret cree a la main sur le
# cluster (oc create secret generic exo12-anthropic-secret --from-literal=...), jamais
# commis dans ce depot public.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exo12-assistant-rag
  labels:
    app: exo12-assistant-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exo12-assistant-rag
  template:
    metadata:
      labels:
        app: exo12-assistant-rag
    spec:
      containers:
        - name: exo12-assistant-rag
          image: image-registry.openshift-image-registry.svc:5000/a-elsa-dev/exo12-assistant-rag:latest
          ports:
            - containerPort: 8501
          envFrom:
            - secretRef:
                name: exo12-anthropic-secret
          # Sans ce bloc, le LimitRange du namespace (resource-limits) impose une
          # limite par defaut de seulement 1000Mi - trop juste pour torch/
          # transformers/chromadb/streamlit charges ensemble, cause du OOMKilled
          # constate le 2026-09-18 (pod tue des le premier upload de document,
          # exactement le moment ou le modele d'embeddings est charge en memoire).
          # Namespace verifie large (quota compute-deploy : 30Gi au total), 2Gi de
          # marge confortable sans rien saturer.
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
